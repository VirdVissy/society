# lamarck live world config — Phase 1 "The Valley Awakens"
# Extends the frozen Phase-0 sections with [model], [universe], [live].
# All quantities integers; fractions are permille. No floats, ever.

[world]
name = "wuxing-valley"
master_seed = "0xDE5EEDDE5EEDDE5E"
days = 30
rounds_per_day = 8
ticks_per_agent_per_round = 1

[population]
founders = 8

[qi]
qi_max = 1200000
daily_allowance = 30000

# Live mode: thinking is billed on LLM_CALL events (qi_llm_cost); these are
# engine-priced SURCHARGES for the physical act only.
[qi.action_costs]
experiment = 200
converse = 0
teach = 100
study = 50
trade = 50
note = 0
travel = 500
meditate = 50
challenge = 100
attempt_breakthrough = 200
rest = 0

[economy]
starting_stones = 20
bounties = [10, 25, 60, 150, 400]
materials = [0, 2, 5, 12, 30]  # tier-1 free: the learning tier must never poverty-lock
stub_success_permille = [500, 250, 120, 50, 15]  # unused in live mode; schema-required

[model]
backend = "mlx"                                   # "scripted" in CI/tests
model_id = "mlx-community/Qwen3-4B-Instruct-2507-4bit"
max_tokens = 220
reflection_max_tokens = 160
temp_permille = 700
seed = 3735928559
prompt_budget_chars = 14000

[universe]
name = "wuxing"
seed = "0x57A57A57A57A57A5"
tiers = 5

[live]
locations = ["meadow", "furnace-hall", "cold-spring"]
first_discovery_multiplier = 3
