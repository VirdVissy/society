[project]
name = "lamarck"
version = "0.1.0.dev0"
description = "A discovery engine whose searchers are mortal, teachable, and watchable."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = [
    "mlx-lm>=0.24",
]
api = [
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lamarck"]

[project.scripts]
lamarck = "lamarck.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["lamarck"]

[[tool.mypy.overrides]]
module = ["lamarck.agents.*", "lamarck.cli", "lamarck.sim"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
